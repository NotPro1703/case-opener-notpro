<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Opener 3.0</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header>
  <div class="logo">🎁 Case Opener <span class="v">3.0</span></div>
  <div class="header-spacer"></div>
  
  <div style="display:flex; flex-direction:column; align-items:flex-end; font-size:0.8rem; color:#8ba3c7; margin-right:10px;">
    <span>Уровень: <b id="playerLevel" style="color:#fff;">1</b></span>
    <span id="playerXp">0 / 1000 XP</span>
  </div>

  <div class="balance-pill">
    <span class="lbl">Баланс</span>
    <span id="balance">0</span> ₽
  </div>
  
  <button class="icon-btn" id="profileBtn" title="Профиль">👤</button>
  <button class="icon-btn" id="lbBtn" title="Топы">🏆</button>
  <button class="icon-btn" id="friendsBtn" title="Друзья">👥</button>
  <button class="icon-btn" id="logoutBtn" title="Выйти">🚪</button>
</header>

<main>
  <div style="text-align:center; margin-bottom:15px; font-size:1.2rem; background:rgba(255,215,0,0.1); padding:10px; border-radius:12px; border:1px solid rgba(255,215,0,0.3);">
    💰 Глобальный Джекпот: <b id="globalJackpot" style="color:#ffd700;">0 ₽</b>
  </div>

  <div class="section-title">Магазин кейсов</div>
  <div class="cases-grid" id="cases"></div>

  <div class="section-title">Статистика</div>
  <div class="stats-grid" id="stats"></div>

  <div class="section-title">Промокод</div>
  <div style="display:flex; gap:10px; margin-bottom:20px;">
    <input type="text" id="promoInput" placeholder="Введите промокод..." style="flex:1; padding:10px; border-radius:10px; border:1px solid #24344f; background:#0e1524; color:#fff;">
    <button class="btn" id="promoBtn" style="width:auto; padding:10px 20px;">Активировать</button>
  </div>
</main>

<footer>Case opener 3.0 Beta by <b>NotPro1703</b></footer>

<!-- ПРОФИЛЬ -->
<div class="modal" id="profileModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>👤 Профиль</h2>
      <button class="modal-close" id="closeProfile">✕</button>
    </div>
    <div style="text-align:center; margin-bottom:15px;">
      <div style="font-size:2rem; font-weight:bold; color:#4da6ff;" id="profName">Игрок</div>
      <div style="color:#8ba3c7;" id="profLevel">Уровень 1</div>
    </div>
    <div class="section-title">Достижения</div>
    <div id="achievementsList" style="max-height:200px; overflow-y:auto; margin-bottom:15px;"></div>
    <div class="section-title">Ежедневные квесты</div>
    <div id="questsList" style="font-size:0.9rem;"></div>
  </div>
</div>

<!-- РУЛЕТКА -->
<div class="overlay" id="overlay">
  <div class="result-big" id="resultBig"></div>
  <div class="roulette-wrap">
    <div class="roulette" id="roulette">
      <div class="fade-left"></div>
      <div class="fade-right"></div>
      <div class="pointer"></div>
      <div class="strip" id="strip"></div>
    </div>
  </div>
  <button class="btn sell-btn" id="sellBtn" style="display:none;">Забрать</button>
</div>

<!-- ДРУЗЬЯ -->
<div class="modal" id="friendsModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>👥 Друзья</h2>
      <button class="modal-close" id="closeFriends">✕</button>
    </div>
    <div class="add-friend">
      <input type="text" id="friendName" placeholder="Имя пользователя">
      <button class="btn" id="addFriendBtn" style="width:auto;padding:10px 18px;">Добавить</button>
    </div>
    <div class="friends-list" id="friendsList"></div>
    <div class="requests-list" id="requestsList"></div>
  </div>
</div>

<!-- ЧАТ -->
<div class="modal" id="chatModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="chatTitle">Чат</h2>
      <button class="modal-close" id="closeChat">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Сообщение...">
      <button class="btn" id="sendMsgBtn" style="width:auto;padding:10px 18px;">→</button>
    </div>
  </div>
</div>

<!-- ПОДАРКИ -->
<div class="modal" id="giftModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>🎁 Подарок</h2>
      <button class="modal-close" id="closeGift">✕</button>
    </div>
    <p style="color:#8ba3c7;font-size:.9rem;margin-bottom:8px;">Перевести деньги игроку <b id="giftToName"></b>:</p>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <input type="number" id="giftMoney" placeholder="Сумма ₽" style="flex:1;padding:10px;background:#0e1524;border:1px solid #24344f;border-radius:10px;color:#fff;">
      <button class="btn" id="sendMoneyBtn" style="width:auto;padding:10px 18px;">Отправить</button>
    </div>
  </div>
</div>

<!-- ТОПЫ -->
<div class="modal" id="lbModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>🏆 Топы</h2>
      <button class="modal-close" id="closeLb">✕</button>
    </div>
    <div class="inv-tabs">
      <button class="lb-tab active" data-lb="balance">По балансу</button>
      <button class="lb-tab" data-lb="opened">По открытым</button>
    </div>
    <div class="lb-list" id="lbList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
